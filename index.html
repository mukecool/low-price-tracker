<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>购物价格记录</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}

:root{
  --bg:#f7f8fa;--card:#ffffff;--card-hover:#fafbfc;
  --text:#111827;--text-2:#6b7280;--text-3:#9ca3af;
  --border:#e8eaed;--border-2:#f0f1f3;
  --accent:#4f46e5;--accent-bg:#eef2ff;
  --success:#059669;--success-bg:#ecfdf5;
  --warning:#d97706;--warning-bg:#fffbeb;
  --danger:#dc2626;--danger-bg:#fef2f2;
  --radius:10px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 2px rgba(16,24,40,.05);
  --shadow-lg:0 8px 24px rgba(16,24,40,.1);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0a0b0e;--card:#15171c;--card-hover:#1a1d24;
    --text:#f1f3f5;--text-2:#9ca3af;--text-3:#6b7280;
    --border:#262a33;--border-2:#1e2128;
    --accent:#818cf8;--accent-bg:#312e8155;
    --success:#34d399;--success-bg:#064e3b40;
    --warning:#fbbf24;--warning-bg:#78350f40;
    --danger:#f87171;--danger-bg:#7f1d1d40;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 1px 3px rgba(0,0,0,.4);
    --shadow-lg:0 8px 24px rgba(0,0,0,.5);
  }
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;
  -webkit-font-smoothing:antialiased;font-size:14px;
}
input,select,button{font-family:inherit}

.container{width:100%;max-width:1400px;margin:0 auto;padding-left:12px;padding-right:12px}
@media(max-width:600px){.container{padding-left:8px;padding-right:8px}}

/* ============ 顶栏 ============ */
.topbar{
  position:sticky;top:0;z-index:30;background:var(--bg);
  border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top);
}
.topbar-inner{display:flex;align-items:center;gap:10px;height:48px}
.brand{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;letter-spacing:-0.01em;flex:0 0 auto}
.brand-icon{
  width:24px;height:24px;background:linear-gradient(135deg,var(--accent),#8b5cf6);
  border-radius:7px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;
}
.search-wrap{flex:1;position:relative;min-width:0}
.search-wrap svg{
  position:absolute;left:10px;top:50%;transform:translateY(-50%);
  width:13px;height:13px;color:var(--text-3);pointer-events:none;
}
/* 用 .search-wrap input 提升优先级，且放在通用 input 规则后面声明效果更好 */
.search-wrap input.search-input{
  width:100%;padding:6px 10px 6px 32px;border:1px solid var(--border);
  border-radius:8px;background:var(--card);color:var(--text);font-size:13px;
  outline:none;transition:border-color .15s,box-shadow .15s;
}
.search-wrap input.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.search-wrap input.search-input::placeholder{color:var(--text-3)}
.topbar-actions{display:flex;gap:5px;flex:0 0 auto;align-items:center}
.icon-btn{
  width:30px;height:30px;border-radius:8px;border:1px solid var(--border);
  background:var(--card);color:var(--text-2);cursor:pointer;
  display:grid;place-items:center;transition:.15s;
}
.icon-btn:hover{background:var(--card-hover);color:var(--text)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:14px;height:14px}
.sync-status{
  font-size:11px;color:var(--text-3);white-space:nowrap;
  max-width:120px;overflow:hidden;text-overflow:ellipsis;
}
.sync-status.err{color:var(--danger)}
@media(max-width:680px){
  .sync-status{display:none}
  .brand span{display:none}
}

/* ============ 工具栏 ============ */
.toolbar{display:flex;align-items:center;gap:8px;padding-top:12px;flex-wrap:wrap}
.chips{
  display:flex;gap:4px;flex:1;min-width:0;
  overflow-x:auto;scrollbar-width:none;padding-bottom:2px;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:4px 10px;border-radius:999px;
  border:1px solid var(--border);background:var(--card);
  color:var(--text-2);font-size:12px;font-weight:500;
  cursor:pointer;transition:.15s;white-space:nowrap;
}
.chip:hover{background:var(--card-hover)}
.chip.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.sort-select{
  flex:0 0 auto;padding:5px 8px;border-radius:8px;
  border:1px solid var(--border);background:var(--card);
  color:var(--text);font-size:12px;cursor:pointer;outline:none;
}

/* ============ 网格（更密） ============ */
.grid{
  display:grid;gap:6px;
  grid-template-columns:repeat(2,minmax(0,1fr));
  padding-top:10px;
  padding-bottom:calc(80px + env(safe-area-inset-bottom));
}
@media(min-width:480px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}}
@media(min-width:720px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}}
@media(min-width:980px){.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}}
@media(min-width:1280px){.grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}}

/* ============ 物品卡片（紧凑） ============ */
.item-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:8px;
  display:flex;flex-direction:column;gap:4px;
  transition:border-color .15s,background .15s;
  position:relative;min-width:0;cursor:pointer;
}
.item-card:hover{border-color:var(--text-3)}
.item-card.expanded{
  grid-column:1/-1;
  padding:14px;
  gap:10px;
  cursor:default;
}

/* 卡片顶部 */
.card-top{display:flex;align-items:center;justify-content:space-between;gap:4px;min-width:0}
.cat-tag{
  font-size:9.5px;font-weight:600;
  color:var(--text-2);background:var(--bg);
  padding:1px 5px;border-radius:4px;letter-spacing:.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  max-width:60%;
}
.buy-count{font-size:10px;color:var(--text-3);font-weight:500;flex:0 0 auto}

.item-name{
  font-size:12px;font-weight:600;letter-spacing:-0.005em;
  line-height:1.3;margin:0;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;min-height:31px;
}
.item-card.expanded .item-name{
  font-size:16px;display:block;-webkit-line-clamp:unset;
  line-height:1.35;min-height:0;font-weight:650;
}

/* 价格行 */
.card-prices{
  display:flex;align-items:baseline;gap:8px;
  padding-top:1px;
}
.cp{display:flex;flex-direction:column;gap:0;min-width:0}
.cp-num{
  font-size:13px;font-weight:700;letter-spacing:-0.02em;
  font-variant-numeric:tabular-nums;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cp-min .cp-num{color:var(--success)}
.cp-avg .cp-num{color:var(--accent);font-size:11px;font-weight:600}
.cp-lbl{
  font-size:9px;color:var(--text-3);
  font-weight:500;letter-spacing:.02em;
}
.item-card.expanded .card-prices{gap:22px;padding:8px 0 10px}
.item-card.expanded .cp-num{font-size:22px}
.item-card.expanded .cp-avg .cp-num{font-size:18px}
.item-card.expanded .cp-lbl{font-size:11px}

/* 卡片底部 */
.card-bottom{
  display:flex;align-items:center;justify-content:space-between;gap:4px;
  margin-top:auto;padding-top:4px;
}
.last-info{
  font-size:10px;color:var(--text-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  flex:1;min-width:0;
}
.quick-add{
  width:22px;height:22px;border-radius:6px;
  border:none;background:var(--accent);
  cursor:pointer;flex:0 0 auto;position:relative;
  display:block;padding:0;
  transition:.15s;
}
.quick-add::before,
.quick-add::after{
  content:'';position:absolute;
  left:50%;top:50%;transform:translate(-50%,-50%);
  background:#fff;border-radius:1px;
}
.quick-add::before{width:11px;height:1.5px}
.quick-add::after{width:1.5px;height:11px}
.quick-add:hover{filter:brightness(1.08)}
.quick-add:active{transform:scale(.9)}

/* 展开区 */
.card-expanded{
  display:none;flex-direction:column;gap:10px;
  padding-top:10px;border-top:1px solid var(--border-2);
  cursor:default;
}
.item-card.expanded .card-expanded{display:flex}

.expanded-actions{display:flex;gap:6px;flex-wrap:wrap}
.btn-tool{
  padding:6px 11px;border-radius:7px;border:1px solid var(--border);
  background:transparent;color:var(--text-2);font-size:12px;
  font-weight:500;cursor:pointer;transition:.15s;white-space:nowrap;
}
.btn-tool:hover{background:var(--card-hover);color:var(--text)}
.btn-tool.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn-tool.danger:hover{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}

/* 历史面板 */
.history-panel{display:flex;flex-direction:column;gap:2px;animation:slideDown .18s ease}
@keyframes slideDown{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}
.history-head{
  font-size:10.5px;font-weight:600;color:var(--text-3);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;
}
.record-row{
  display:flex;align-items:center;gap:9px;
  padding:6px 9px;border-radius:7px;
  font-size:12.5px;transition:background .15s;min-width:0;
}
.record-row:hover{background:var(--bg)}
.record-row.is-min{background:var(--success-bg);color:var(--success)}
.record-row.is-min .rec-price{color:var(--success);font-weight:700}
.rec-date{font-variant-numeric:tabular-nums;color:var(--text-3);flex:0 0 auto;font-size:11.5px}
.record-row.is-min .rec-date{color:var(--success);opacity:.85}
.rec-platform{
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;color:var(--text-2);
}
.record-row.is-min .rec-platform{color:var(--success);opacity:.9}
.rec-price{font-weight:600;font-variant-numeric:tabular-nums;flex:0 0 auto}
.rec-qty{font-size:10.5px;color:var(--text-3);background:var(--bg);padding:1px 5px;border-radius:3px;flex:0 0 auto}
.record-row.is-min .rec-qty{background:rgba(255,255,255,.3);color:var(--success)}
.rec-actions{display:flex;gap:1px;flex:0 0 auto;opacity:0;transition:opacity .15s}
.record-row:hover .rec-actions{opacity:1}
@media(max-width:640px){.rec-actions{opacity:1}}
.rec-act{
  width:24px;height:24px;border-radius:6px;border:none;
  background:transparent;color:var(--text-3);cursor:pointer;
  font-size:13px;line-height:1;display:grid;place-items:center;transition:.15s;
}
.rec-act:hover{background:var(--border);color:var(--text)}
.rec-act.del:hover{background:var(--danger-bg);color:var(--danger)}

/* 比价面板 */
.compare-panel{display:flex;flex-direction:column;gap:8px;animation:slideDown .18s ease}
.compare-input-row{display:flex;align-items:center;gap:9px}
.compare-input-row label{font-size:12px;color:var(--text-2);font-weight:500;flex:0 0 auto}
.compare-input-wrap{flex:1;position:relative;display:flex;align-items:center;max-width:300px}
.compare-input-wrap .cur{
  position:absolute;left:10px;color:var(--text-3);
  font-size:13px;pointer-events:none;font-weight:500;
}
.compare-input{
  width:100%;padding:7px 11px 7px 26px;
  border:1px solid var(--border);border-radius:8px;
  background:var(--bg);color:var(--text);
  font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;
  outline:none;transition:.15s;
}
.compare-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);background:var(--card)}
.compare-result{
  font-size:12.5px;line-height:1.6;padding:9px 11px;
  border-radius:8px;background:var(--bg);display:none;
}
.compare-result.show{display:block}
.cmp-line{display:flex;align-items:center;gap:5px}
.cmp-line + .cmp-line{margin-top:2px}
.cmp-badge{font-weight:700;font-variant-numeric:tabular-nums}
.cmp-good{color:var(--success)}
.cmp-warn{color:var(--warning)}
.cmp-bad{color:var(--danger)}
.cmp-muted{color:var(--text-3)}

/* 空状态 */
.empty{text-align:center;padding:60px 16px 50px;color:var(--text-2)}
.empty-icon{
  width:56px;height:56px;margin:0 auto 14px;
  background:var(--card);border:1px solid var(--border);
  border-radius:18px;display:grid;place-items:center;
  font-size:24px;box-shadow:var(--shadow);
}
.empty h3{margin:0 0 5px;font-size:15px;font-weight:600;color:var(--text)}
.empty p{margin:0;font-size:12.5px;color:var(--text-3);line-height:1.7}

/* FAB */
.fab{
  position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));
  z-index:25;padding:10px 16px;border:none;border-radius:999px;
  background:var(--accent);color:#fff;font-size:13px;font-weight:600;
  cursor:pointer;box-shadow:0 5px 16px rgba(79,70,229,.35);
  transition:.15s;display:flex;align-items:center;gap:4px;
}
.fab:hover{filter:brightness(1.08);transform:translateY(-1px)}
.fab:active{transform:scale(.96)}
@media(max-width:600px){
  .fab{right:10px;bottom:calc(10px + env(safe-area-inset-bottom));padding:9px 14px;font-size:12.5px}
}

/* ============ 按钮 ============ */
.btn{
  padding:9px 16px;border-radius:9px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:13.5px;font-weight:500;
  cursor:pointer;transition:.15s;white-space:nowrap;
}
.btn:hover{background:var(--card-hover)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--bg);color:var(--text)}

/* ============ 弹窗 ============ */
dialog{
  border:none;border-radius:16px;padding:0;
  width:min(500px,calc(100vw - 24px));max-height:88vh;
  background:var(--card);color:var(--text);
  box-shadow:0 24px 64px rgba(0,0,0,.28);overflow:hidden;
}
dialog::backdrop{background:rgba(0,0,0,.42);backdrop-filter:blur(3px)}
.dlg{display:flex;flex-direction:column;max-height:88vh;margin:0}
.dlg-head{
  padding:18px 20px 14px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex:0 0 auto;
}
.dlg-head h3{margin:0;font-size:16px;font-weight:700;letter-spacing:-0.01em}
.dlg-body{
  padding:18px 20px;overflow-y:auto;
  display:flex;flex-direction:column;gap:14px;flex:1;
}
.dlg-foot{
  padding:14px 20px 18px;border-top:1px solid var(--border);
  display:flex;justify-content:flex-end;gap:8px;flex:0 0 auto;
}
@media(max-width:480px){.dlg-foot .btn{flex:1}}

/* 表单 —— 注意：这里不再包含 input[type=search]，避免覆盖顶栏搜索框 */
.field{display:flex;flex-direction:column;gap:6px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field label{font-size:12px;font-weight:600;color:var(--text-2);letter-spacing:.01em}
.input,input[type=text],input[type=password],input[type=number],
input[type=date],select{
  width:100%;padding:9px 12px;border:1px solid var(--border);
  border-radius:9px;background:var(--bg);color:var(--text);
  font-size:14px;outline:none;
  transition:border-color .15s,box-shadow .15s,background .15s;
}
.input:focus,input:focus,select:focus{
  border-color:var(--accent);background:var(--card);
  box-shadow:0 0 0 3px var(--accent-bg);
}
input::placeholder{color:var(--text-3)}

/* 常用平台 chips */
.platform-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.platform-chips:empty{display:none}
.platform-empty-hint{font-size:11.5px;color:var(--text-3);padding:2px 0;line-height:1.5}
.platform-chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 5px 4px 10px;border-radius:999px;
  border:1px solid var(--border);background:var(--card);
  color:var(--text-2);font-size:12px;font-weight:500;
  cursor:pointer;transition:.15s;user-select:none;
}
.platform-chip:hover{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.platform-chip .pc-x{
  width:15px;height:15px;border-radius:50%;
  display:grid;place-items:center;font-size:12px;line-height:1;
  color:var(--text-3);cursor:pointer;transition:.15s;
}
.platform-chip .pc-x:hover{background:rgba(220,38,38,.15);color:var(--danger)}

/* 设置里的平台管理 */
.platform-manage{
  display:flex;flex-wrap:wrap;gap:5px;min-height:42px;
  padding:10px 11px;border:1px solid var(--border);
  border-radius:9px;background:var(--bg);align-content:flex-start;
}
.platform-manage .platform-chip{background:var(--card)}
.platform-manage:empty::before{
  content:'暂无常用平台，可在下方添加';
  color:var(--text-3);font-size:12px;margin:auto;
}
.platform-add{display:flex;gap:7px;margin-top:7px}
.platform-add input{flex:1;min-width:0}
.platform-add .btn{flex:0 0 auto;padding:9px 14px;font-size:12.5px}

/* 设置提示 */
.hint{
  margin:0;font-size:12px;color:var(--text-3);line-height:1.7;
  padding:11px 13px;background:var(--bg);border-radius:9px;
}
.hint b{color:var(--text-2);font-weight:600}
.hint code{
  background:var(--card);padding:1px 5px;border-radius:4px;
  font-size:11px;border:1px solid var(--border);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
.gist-row{display:flex;gap:7px}
.gist-row .input{flex:1;min-width:0}
.gist-row .btn{flex:0 0 auto;padding:9px 12px;font-size:12.5px}

/* 弹窗里的物品提示 */
.item-hint{
  display:flex;align-items:center;gap:7px;
  padding:10px 13px;background:var(--accent-bg);
  border-radius:9px;font-size:13.5px;color:var(--accent);font-weight:600;
}
.item-hint .ih-label{
  font-size:10.5px;font-weight:600;color:var(--accent);opacity:.7;
  text-transform:uppercase;letter-spacing:.06em;
}

/* 滚动条 */
.dlg-body::-webkit-scrollbar{width:8px}
.dlg-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
</head>
<body>

<header class="topbar">
  <div class="container topbar-inner">
    <div class="brand">
      <div class="brand-icon">¥</div>
      <span>价格记录</span>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="m21 21-3.5-3.5"/>
      </svg>
      <input id="search" class="search-input" type="text" autocomplete="off" aria-label="搜索">
    </div>
    <div class="topbar-actions">
      <span id="syncStatus" class="sync-status">本地模式</span>
      <button class="icon-btn" id="btnSync" title="立即同步">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
        </svg>
      </button>
      <button class="icon-btn" id="btnSettings" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main class="container">

      <div class="field">

        <div class="gist-row">

        · Token 只存在本机浏览器，不会写进网页、也不会提交到仓库。<br>

<dialog id="dlgRecord">
  <form method="dialog" class="dlg">
    <div class="dlg-head"><h3 id="recordTitle">记录购买</h3></div>
    <div class="dlg-body">
      <div class="item-hint" id="recordItemHint" style="display:none">

        <input id="inpPlatform" type="text" placeholder="京东 / 淘宝 / 拼多多…" autocomplete="off">

        <input id="inpRecordNote" type="text" placeholder="优惠券、满减信息…">
      </div>

      <button class="btn btn-primary" value="ok">保存</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  'use strict';

  /* ================= 常量 ================= */
  const FILE_NAME = 'shopping-data.json';
  const LS_CFG    = 'shopmin.cfg.v4';
  const LS_DATA   = 'shopmin.data.v4';

  const $ = s => document.querySelector(s);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
  const fmtMoney = n => {
    const v = Number(n);
    if (!isFinite(v)) return '—';
    return '¥' + v.toFixed(2);
  };
  const today = () => {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  };
  const shortDate = s => {
    if (!s) return '';
    const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return s;
    const now = new Date();
    const y = now.getFullYear();
    return (m[1] === String(y) ? '' : m[1] + '/') + m[2] + '/' + m[3];
  };
  const timeStr = () => new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

  /* ================= 状态 ================= */
  let cfg = { gistId: '', token: '' };
  let state = { version: 4, updatedAt: 0, items: [], platforms: [] };
  let activeCat = 'all';
  let editingItemId = null;
  let editingRecord = null;
  let currentRecordItemId = null;
  let pushing = false, pendingPush = false, saveTimer = null;

  const expandedSet = new Set();
  const expandedCompare = new Map();

  /* ================= DOM ================= */
  const els = {
    status: $('#syncStatus'),
    grid: $('#grid'),
    empty: $('#empty'),
    search: $('#search'),
    sort: $('#sort'),
    chips: $('#chips'),
    categoryList: $('#categoryList')
  };

  /* ================= 工具 ================= */
  function setStatus(text, isErr) {
    els.status.textContent = text;
    els.status.classList.toggle('err', !!isErr);
  }

  function unitPrice(rec) {
    const p = Number(rec.price);
    const q = Number(rec.qty) || 1;
    if (!isFinite(p) || q <= 0) return null;
    return p / q;
  }

  function calcStats(item) {
    const recs = (item.records || []).slice();
    const valid = recs.filter(r => unitPrice(r) !== null);
    const empty = { count: 0, avg: null, min: null, max: null, latest: null, minRec: null };
    if (!valid.length) return empty;

    const prices = valid.map(unitPrice);
    const sum = prices.reduce((a, b) => a + b, 0);
    const sorted = valid.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
    const latest = sorted[0];
    const minPrice = Math.min(...prices);
    const minRec = valid.find(r => unitPrice(r) === minPrice) || null;

    return {
      count: valid.length,
      avg: sum / valid.length,
      min: minPrice,
      max: Math.max(...prices),
      latest,
      minRec
    };
  }

  /* ================= 常用平台 ================= */
  function rememberPlatform(name) {
    name = (name || '').trim();
    if (!name) return;
    if (!Array.isArray(state.platforms)) state.platforms = [];
    const idx = state.platforms.indexOf(name);
    if (idx >= 0) state.platforms.splice(idx, 1);
    state.platforms.unshift(name);
    if (state.platforms.length > 30) state.platforms.length = 30;
  }

  function removePlatform(name) {
    if (!Array.isArray(state.platforms)) return;
    state.platforms = state.platforms.filter(p => p !== name);
  }

  function chipsHTML(list) {
    return list.map(p =>
      '<span class="platform-chip" data-platform="' + esc(p) + '">' +
        esc(p) +
        '<span class="pc-x" data-remove="' + esc(p) + '" title="从常用中移除">×</span>' +
      '</span>'
    ).join('');
  }

  function renderPlatformChips() {
    const box = $('#platformChips');
    if (!box) return;
    const list = state.platforms || [];
    if (!list.length) {
      box.innerHTML = '<span class="platform-empty-hint">输入新平台并保存后，会自动记住供下次选择</span>';
      return;
    }
    box.innerHTML = chipsHTML(list);
  }

  function renderPlatformManage() {
    const box = $('#platformManage');
    if (!box) return;
    const list = state.platforms || [];
    box.innerHTML = list.length ? chipsHTML(list) : '';
  }

  /* ================= 本地存储 ================= */
  function loadLocal() {
    try {
      const c = JSON.parse(localStorage.getItem(LS_CFG));
      if (c && typeof c === 'object') cfg = { gistId: c.gistId || '', token: c.token || '' };
    } catch (e) {}
    try {
      const d = JSON.parse(localStorage.getItem(LS_DATA));
      if (d && Array.isArray(d.items)) {
        state = {
          version: 4,
          updatedAt: d.updatedAt || 0,
          items: d.items,
          platforms: Array.isArray(d.platforms) ? d.platforms.slice() : []
        };
        if (!state.platforms.length) {
          const seen = new Map();
          state.items.forEach(it => {
            (it.records || []).forEach(r => {
              const p = (r.platform || '').trim();
              if (p) seen.set(p, (seen.get(p) || 0) + 1);
            });
          });
          state.platforms = [...seen.entries()]
            .sort((a, b) => b[1] - a[1])
            .map(e => e[0]);
        }
      }
    } catch (e) {}
  }
  function saveLocal() {
    localStorage.setItem(LS_DATA, JSON.stringify(state));
  }

  /* ================= 云端同步 ================= */
  async function pull() {
    if (!cfg.gistId) { setStatus('本地模式'); return; }
    setStatus('同步中…');
    try {
      const headers = { 'Accept': 'application/vnd.github+json' };
      if (cfg.token) headers['Authorization'] = 'Bearer ' + cfg.token;

      const res = await fetch('https://api.github.com/gists/' + encodeURIComponent(cfg.gistId),
        { headers, cache: 'no-store' });
      if (!res.ok) {
        throw new Error('HTTP ' + res.status +
          (res.status === 401 ? '（Token 无效）' :
           res.status === 404 ? '（ID 或权限有误）' : ''));
      }
      const data = await res.json();
      const file = data.files && data.files[FILE_NAME];

      if (!file) { await push(); return; }

      const parsed = JSON.parse(file.content || '{}');
      if (Array.isArray(parsed.items)) {
        state = {
          version: 4,
          updatedAt: parsed.updatedAt || 0,
          items: parsed.items,
          platforms: Array.isArray(parsed.platforms) ? parsed.platforms : []
        };
        if (!state.platforms.length) {
          const seen = new Map();
          state.items.forEach(it => {
            (it.records || []).forEach(r => {
              const p = (r.platform || '').trim();
              if (p) seen.set(p, (seen.get(p) || 0) + 1);
            });
          });
          state.platforms = [...seen.entries()]
            .sort((a, b) => b[1] - a[1])
            .map(e => e[0]);
        }
        saveLocal();
        render();
      }
      setStatus('已同步 · ' + timeStr());
    } catch (err) {
      setStatus('同步失败：' + err.message, true);
    }
  }

  async function push() {
    if (!cfg.gistId || !cfg.token) { setStatus('本地模式'); return; }
    if (pushing) { pendingPush = true; return; }
    pushing = true;
    setStatus('保存中…');
    try {
      const content = JSON.stringify(state, null, 2);
      const res = await fetch('https://api.github.com/gists/' + encodeURIComponent(cfg.gistId), {
        method: 'PATCH',
        headers: {
          'Accept': 'application/vnd.github+json',
          'Authorization': 'Bearer ' + cfg.token,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ files: { [FILE_NAME]: { content } } })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      localStorage.setItem(LS_DATA, content);
      setStatus('已保存 · ' + timeStr());
    } catch (err) {
      setStatus('保存失败：' + err.message, true);
    } finally {
      pushing = false;
      if (pendingPush) { pendingPush = false; push(); }
    }
  }

  function save(immediate) {
    saveLocal();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(push, immediate ? 0 : 1200);
  }

  /* ================= 渲染 ================= */
  function renderChips() {
    const cats = [...new Set((state.items || []).map(it => it.category).filter(Boolean))].sort();
    if (activeCat !== 'all' && !cats.includes(activeCat)) activeCat = 'all';

    let html = '<button class="chip' + (activeCat === 'all' ? ' active' : '') + '" data-cat="all">全部</button>';
    cats.forEach(c => {
      html += '<button class="chip' + (activeCat === c ? ' active' : '') + '" data-cat="' + esc(c) + '">' + esc(c) + '</button>';
    });
    els.chips.innerHTML = html;
    els.categoryList.innerHTML = cats.map(c => '<option value="' + esc(c) + '">').join('');
  }

  function recordRowHTML(item, rec, minRec) {
    const isMin = minRec && rec.id === minRec.id;
    const qty = Number(rec.qty) || 1;
    const up = unitPrice(rec);

    return '<div class="record-row' + (isMin ? ' is-min' : '') + '" data-rec-id="' + esc(rec.id) + '">' +
      '<span class="rec-date">' + esc(shortDate(rec.date)) + '</span>' +
      '<span class="rec-platform">' + esc(rec.platform || '未填平台') + '</span>' +
      (qty > 1 ? '<span class="rec-qty">×' + qty + '</span>' : '') +
      '<span class="rec-price">' + (up === null ? '—' : fmtMoney(up)) + '</span>' +
      '<div class="rec-actions">' +
        '<button class="rec-act" data-act="edit-rec" title="编辑">✎</button>' +
        '<button class="rec-act del" data-act="del-rec" title="删除">×</button>' +
      '</div>' +
    '</div>';
  }

  function itemCardHTML(item) {
    const stats = calcStats(item);
    const cat = item.category;
    const expanded = expandedSet.has(item.id);
    const compareVal = expandedCompare.get(item.id);
    const showCompare = compareVal !== undefined;

    const catTag = cat
      ? '<span class="cat-tag">' + esc(cat) + '</span>'
      : '<span></span>';

    const countText = stats.count > 0 ? stats.count + ' 次' : '—';
    const unitSuffix = item.unit ? ' / ' + esc(item.unit) : '';

    const minVal = stats.min !== null
      ? '<span class="cp-num">' + fmtMoney(stats.min) + '</span>'
      : '<span class="cp-num" style="color:var(--text-3);font-weight:500">—</span>';
    const avgVal = stats.avg !== null
      ? '<span class="cp-num">' + fmtMoney(stats.avg) + '</span>'
      : '<span class="cp-num" style="color:var(--text-3);font-weight:500">—</span>';

    let lastInfo = '';
    if (stats.latest) {
      lastInfo = esc(shortDate(stats.latest.date)) + ' · ' + esc(stats.latest.platform || '—');
    } else {
      lastInfo = '无记录';
    }

    let expandedHTML = '';
    if (expanded) {
      let historyRows = '';
      const sorted = (item.records || []).slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
      if (sorted.length) {
        historyRows = sorted.map(r => recordRowHTML(item, r, stats.minRec)).join('');
      } else {
        historyRows = '<div style="font-size:12.5px;color:var(--text-3);padding:8px 4px">还没有记录</div>';
      }

      const historyPanel =
        '<div class="history-panel">' +
          '<div class="history-head">购买历史 · ' + (item.records || []).length + ' 条</div>' +
          historyRows +
        '</div>';

      let comparePanel = '';
      if (showCompare) {
        const inputVal = compareVal === '' ? '' : compareVal;
        let result = '';
        const v = Number(compareVal);
        if (compareVal !== '' && isFinite(v) && v >= 0 && stats.avg !== null) {
          const diffAvg = stats.avg - v;
          const pct = stats.avg > 0 ? (diffAvg / stats.avg * 100) : 0;
          const diffMin = stats.min !== null ? v - stats.min : null;

          let line1, cls1;
          if (diffAvg > 0.005) {
            cls1 = 'cmp-good';
            line1 = '✓ 比均价低 ' + fmtMoney(diffAvg) + '（' + Math.abs(pct).toFixed(1) + '%）';
          } else if (diffAvg < -0.005) {
            cls1 = 'cmp-warn';
            line1 = '↑ 比均价高 ' + fmtMoney(-diffAvg) + '（' + Math.abs(pct).toFixed(1) + '%）';
          } else {
            cls1 = 'cmp-muted';
            line1 = '≈ 与均价持平';
          }

          let line2 = '';
          if (diffMin !== null) {
            if (diffMin < -0.005) {
              line2 = '<div class="cmp-line"><span class="cmp-badge cmp-good">🎉 比历史最低还低 ' + fmtMoney(-diffMin) + '</span></div>';
            } else if (diffMin > 0.005) {
              line2 = '<div class="cmp-line"><span class="cmp-badge cmp-muted">比历史最低高 ' + fmtMoney(diffMin) + '</span></div>';
            } else {
              line2 = '<div class="cmp-line"><span class="cmp-badge cmp-good">= 与历史最低持平</span></div>';
            }
          }

          result = '<div class="cmp-line"><span class="cmp-badge ' + cls1 + '">' + line1 + '</span></div>' + line2;
        } else if (compareVal !== '' && stats.avg === null) {
          result = '<div class="cmp-line cmp-muted">还没有历史记录，无法对比</div>';
        }

        comparePanel = '<div class="compare-panel">' +
          '<div class="compare-input-row">' +
            '<label>看到的价格</label>' +
            '<div class="compare-input-wrap">' +
              '<span class="cur">¥</span>' +
              '<input class="compare-input" type="number" step="0.01" min="0" inputmode="decimal" ' +
                'placeholder="输入后自动对比" value="' + esc(inputVal) + '" ' +
                'data-compare-id="' + esc(item.id) + '">' +
            '</div>' +
          '</div>' +
          '<div class="compare-result' + (result ? ' show' : '') + '">' + result + '</div>' +
        '</div>';
      }

      expandedHTML =
        '<div class="card-expanded">' +
          '<div class="expanded-actions">' +
            '<button class="btn-tool' + (showCompare ? ' active' : '') + '" data-act="toggle-compare">' +
              (showCompare ? '收起比价' : '比价') +
            '</button>' +
            '<button class="btn-tool" data-act="edit-item">编辑</button>' +
            '<button class="btn-tool danger" data-act="del-item">删除物品</button>' +
          '</div>' +
          historyPanel +
          comparePanel +
        '</div>';
    }

    return '<article class="item-card' + (expanded ? ' expanded' : '') + '" data-id="' + esc(item.id) + '">' +
      '<div class="card-top">' +
        catTag +
        '<span class="buy-count">' + esc(countText) + '</span>' +
      '</div>' +
      '<h3 class="item-name">' + esc(item.name || '未命名') + '</h3>' +
      '<div class="card-prices">' +
        '<div class="cp cp-min">' + minVal + '<span class="cp-lbl">最低' + unitSuffix + '</span></div>' +
        '<div class="cp cp-avg">' + avgVal + '<span class="cp-lbl">均价' + unitSuffix + '</span></div>' +
      '</div>' +
      '<div class="card-bottom">' +
        '<span class="last-info">' + lastInfo + '</span>' +
        '<button class="quick-add" data-act="add-rec" title="记录购买"></button>' +
      '</div>' +
      expandedHTML +
    '</article>';
  }

  function render() {
    const q = els.search.value.trim().toLowerCase();
    const sort = els.sort.value;

    let items = (state.items || []).slice();

    if (activeCat !== 'all') {
      items = items.filter(it => it.category === activeCat);
    }
    if (q) {
      items = items.filter(it =>
        (it.name || '').toLowerCase().includes(q) ||
        (it.note || '').toLowerCase().includes(q) ||
        (it.category || '').toLowerCase().includes(q) ||
        (it.records || []).some(r => (r.platform || '').toLowerCase().includes(q) ||
                                     (r.note || '').toLowerCase().includes(q))
      );
    }

    items.sort((a, b) => {
      const sa = calcStats(a), sb = calcStats(b);
      if (sort === 'name') return (a.name || '').localeCompare(b.name || '', 'zh-CN');
      if (sort === 'records') return (b.records || []).length - (a.records || []).length;
      if (sort === 'avg-asc') {
        const va = sa.avg === null ? Infinity : sa.avg;
        const vb = sb.avg === null ? Infinity : sb.avg;
        return va - vb;
      }
      if (sort === 'avg-desc') {
        const va = sa.avg === null ? -Infinity : sa.avg;
        const vb = sb.avg === null ? -Infinity : sb.avg;
        return vb - va;
      }
      const da = sa.latest ? String(sa.latest.date) : '';
      const db = sb.latest ? String(sb.latest.date) : '';
      if (da && db) return db.localeCompare(da);
      if (da) return -1;
      if (db) return 1;
      return (b.updatedAt || 0) - (a.updatedAt || 0);
    });

    renderChips();

    if (!items.length) {
      els.grid.innerHTML = '';
      els.empty.hidden = false;
      return;
    }
    els.empty.hidden = true;
    els.grid.innerHTML = items.map(itemCardHTML).join('');
  }

  /* ================= 物品编辑弹窗 ================= */
  function openItemDialog(id) {
    editingItemId = id || null;
    const it = id ? (state.items || []).find(x => x.id === id) : null;

    $('#itemTitle').textContent = it ? '编辑物品' : '添加物品';
    $('#inpName').value = it ? (it.name || '') : '';
    $('#inpCategory').value = it ? (it.category || '') : '';
    $('#inpUnit').value = it ? (it.unit || '') : '';
    $('#inpNote').value = it ? (it.note || '') : '';

    $('#dlgItem').showModal();
    setTimeout(() => { if (!it) $('#inpName').focus(); }, 60);
  }

  $('#dlgItem').addEventListener('close', e => {
    if (e.target.returnValue !== 'ok') return;

    const name = $('#inpName').value.trim();
    if (!name) { alert('请填写物品名称'); return; }

    const now = Date.now();

    if (editingItemId) {
      const it = state.items.find(x => x.id === editingItemId);
      if (it) {
        it.name = name;
        it.category = $('#inpCategory').value.trim();
        it.unit = $('#inpUnit').value.trim();
        it.note = $('#inpNote').value.trim();
        it.updatedAt = now;
      }
    } else {
      state.items.unshift({
        id: uid(),
        name,
        category: $('#inpCategory').value.trim(),
        unit: $('#inpUnit').value.trim(),
        note: $('#inpNote').value.trim(),
        records: [],
        createdAt: now,
        updatedAt: now
      });
    }

    state.updatedAt = now;
    save();
    render();
  });

  /* ================= 记录编辑弹窗 ================= */
  function openRecordDialog(itemId, recordId) {
    const item = (state.items || []).find(x => x.id === itemId);
    if (!item) return;

    currentRecordItemId = itemId;
    editingRecord = recordId ? { itemId, recordId } : null;

    const rec = recordId
      ? (item.records || []).find(r => r.id === recordId)
      : null;

    $('#recordTitle').textContent = rec ? '编辑购买记录' : '记录购买';
    $('#recordItemHint').style.display = 'flex';
    $('#recordItemName').textContent = item.name + (item.unit ? '（' + item.unit + '）' : '');

    $('#inpDate').value = rec ? rec.date : today();
    $('#inpPlatform').value = rec ? (rec.platform || '') : '';
    $('#inpPrice').value = rec ? (rec.price ?? '') : '';
    $('#inpQty').value = rec ? (rec.qty || 1) : 1;
    $('#inpRecordNote').value = rec ? (rec.note || '') : '';

    renderPlatformChips();

    $('#dlgRecord').showModal();
    setTimeout(() => {
      if (!rec) $('#inpPrice').focus();
    }, 60);
  }

  $('#platformChips').addEventListener('click', e => {
    const x = e.target.closest('[data-remove]');
    if (x) {
      e.preventDefault();
      e.stopPropagation();
      const p = x.dataset.remove;
      if (confirm('从常用平台移除「' + p + '」？\n已有记录不受影响，只影响下次的建议列表。')) {
        removePlatform(p);
        save();
        renderPlatformChips();
        renderPlatformManage();
      }
      return;
    }
    const chip = e.target.closest('.platform-chip');
    if (chip) {
      $('#inpPlatform').value = chip.dataset.platform;
      $('#inpPlatform').focus();
    }
  });

  $('#dlgRecord').addEventListener('close', e => {
    if (e.target.returnValue !== 'ok') return;

    const item = (state.items || []).find(x => x.id === currentRecordItemId);
    if (!item) return;

    const date = $('#inpDate').value || today();
    const platform = $('#inpPlatform').value.trim();
    const priceRaw = $('#inpPrice').value.trim();
    const qtyRaw = $('#inpQty').value.trim();
    const note = $('#inpRecordNote').value.trim();

    if (priceRaw === '') { alert('请填写价格'); return; }
    const price = Number(priceRaw);
    if (!isFinite(price) || price < 0) { alert('价格无效'); return; }

    const qty = qtyRaw === '' ? 1 : Number(qtyRaw);
    if (!isFinite(qty) || qty <= 0) { alert('数量无效'); return; }

    if (platform) rememberPlatform(platform);

    const now = Date.now();

    if (editingRecord) {
      const rec = (item.records || []).find(r => r.id === editingRecord.recordId);
      if (rec) {
        rec.date = date;
        rec.platform = platform;
        rec.price = price;
        rec.qty = qty;
        rec.note = note;
      }
    } else {
      if (!item.records) item.records = [];
      item.records.push({
        id: uid(),
        date, platform, price, qty, note,
        createdAt: now
      });
    }

    item.updatedAt = now;
    state.updatedAt = now;
    save();
    render();
  });

  /* ================= 设置弹窗 ================= */
  $('#btnSettings').addEventListener('click', () => {
    $('#inpGist').value = cfg.gistId;
    $('#inpToken').value = cfg.token;
    $('#inpNewPlatform').value = '';
    renderPlatformManage();
    $('#dlgSettings').showModal();
  });

  $('#platformManage').addEventListener('click', e => {
    const x = e.target.closest('[data-remove]');
    if (!x) return;
    const p = x.dataset.remove;
    if (confirm('从常用平台移除「' + p + '」？\n已有记录不受影响，只影响下次的建议列表。')) {
      removePlatform(p);
      save();
      renderPlatformChips();
      renderPlatformManage();
    }
  });

  function addNewPlatformFromSettings() {
    const inp = $('#inpNewPlatform');
    const v = inp.value.trim();
    if (!v) { inp.focus(); return; }
    if ((state.platforms || []).includes(v)) {
      alert('「' + v + '」已经在常用列表里了');
      inp.select();
      return;
    }
    rememberPlatform(v);
    inp.value = '';
    save();
    renderPlatformChips();
    renderPlatformManage();
  }

  $('#btnAddPlatform').addEventListener('click', addNewPlatformFromSettings);
  $('#inpNewPlatform').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      addNewPlatformFromSettings();
    }
  });

  $('#btnCreateGist').addEventListener('click', async () => {
    const token = $('#inpToken').value.trim();
    if (!token) {
      alert('请先填写 GitHub Token，创建 Gist 需要它。');
      $('#inpToken').focus();
      return;
    }

    const btn = $('#btnCreateGist');
    btn.disabled = true;
    btn.textContent = '创建中…';

    try {
      const content = JSON.stringify(state, null, 2);
      const res = await fetch('https://api.github.com/gists', {
        method: 'POST',
        headers: {
          'Accept': 'application/vnd.github+json',
          'Authorization': 'Bearer ' + token,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          description: '购物价格记录（自动同步）',
          public: false,
          files: { [FILE_NAME]: { content } }
        })
      });

      if (!res.ok) {
        let msg = 'HTTP ' + res.status;
        if (res.status === 401) msg += '（Token 无效或过期）';
        if (res.status === 403) msg += '（Token 缺少 gist 权限）';
        throw new Error(msg);
      }

      const data = await res.json();
      $('#inpGist').value = data.id;

      cfg.gistId = data.id;
      cfg.token = token;
      localStorage.setItem(LS_CFG, JSON.stringify(cfg));
      setStatus('已创建 · ' + String(data.id).slice(0, 8) + '…');

      alert('创建成功！\nGist ID：' + data.id + '\n已自动填入并保存，点「保存并同步」确认。');
    } catch (err) {
      alert('创建失败：' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '创建新 Gist';
    }
  });

  $('#dlgSettings').addEventListener('close', e => {
    if (e.target.returnValue !== 'ok') return;
    cfg.gistId = $('#inpGist').value.trim();
    cfg.token = $('#inpToken').value.trim();
    localStorage.setItem(LS_CFG, JSON.stringify(cfg));
    if (cfg.gistId) pull();
    else setStatus('本地模式');
  });

  /* ================= 卡片事件委托 ================= */
  els.grid.addEventListener('click', e => {
    const card = e.target.closest('.item-card');
    if (!card) return;
    const itemId = card.dataset.id;
    const item = (state.items || []).find(x => x.id === itemId);
    if (!item) return;

    const actBtn = e.target.closest('[data-act]');
    if (actBtn) {
      e.stopPropagation();
      const act = actBtn.dataset.act;

      if (act === 'add-rec') {
        openRecordDialog(itemId, null);
      } else if (act === 'edit-item') {
        openItemDialog(itemId);
      } else if (act === 'del-item') {
        if (confirm('确定删除「' + item.name + '」？\n该物品的所有购买记录会一并删除。')) {
          state.items = state.items.filter(x => x.id !== itemId);
          state.updatedAt = Date.now();
          expandedSet.delete(itemId);
          expandedCompare.delete(itemId);
          save(true);
          render();
        }
      } else if (act === 'toggle-compare') {
        if (expandedCompare.has(itemId)) expandedCompare.delete(itemId);
        else expandedCompare.set(itemId, '');
        render();
      } else if (act === 'edit-rec') {
        const recId = e.target.closest('.record-row')?.dataset.recId;
        if (recId) openRecordDialog(itemId, recId);
      } else if (act === 'del-rec') {
        const recId = e.target.closest('.record-row')?.dataset.recId;
        if (!recId) return;
        if (confirm('删除这条记录？')) {
          item.records = (item.records || []).filter(r => r.id !== recId);
          item.updatedAt = Date.now();
          state.updatedAt = Date.now();
          save(true);
          render();
        }
      }
      return;
    }

    // 点击卡片空白处切换展开
    if (expandedSet.has(itemId)) {
      expandedSet.delete(itemId);
    } else {
      expandedSet.add(itemId);
    }
    render();
  });

  // 比价实时计算
  els.grid.addEventListener('input', e => {
    const inp = e.target.closest('.compare-input');
    if (!inp) return;
    const itemId = inp.dataset.compareId;
    const val = inp.value;

    expandedCompare.set(itemId, val);

    const card = inp.closest('.item-card');
    const resultEl = card.querySelector('.compare-result');
    const item = (state.items || []).find(x => x.id === itemId);
    if (!item || !resultEl) return;

    const stats = calcStats(item);
    const v = Number(val);

    if (val === '' || !isFinite(v) || v < 0) {
      resultEl.classList.remove('show');
      resultEl.innerHTML = '';
      return;
    }
    if (stats.avg === null) {
      resultEl.classList.add('show');
      resultEl.innerHTML = '<div class="cmp-line cmp-muted">还没有历史记录，无法对比</div>';
      return;
    }

    const diffAvg = stats.avg - v;
    const pct = stats.avg > 0 ? (diffAvg / stats.avg * 100) : 0;
    const diffMin = stats.min !== null ? v - stats.min : null;

    let line1, cls1;
    if (diffAvg > 0.005) {
      cls1 = 'cmp-good';
      line1 = '✓ 比均价低 ' + fmtMoney(diffAvg) + '（' + Math.abs(pct).toFixed(1) + '%）';
    } else if (diffAvg < -0.005) {
      cls1 = 'cmp-warn';
      line1 = '↑ 比均价高 ' + fmtMoney(-diffAvg) + '（' + Math.abs(pct).toFixed(1) + '%）';
    } else {
      cls1 = 'cmp-muted';
      line1 = '≈ 与均价持平';
    }

    let line2 = '';
    if (diffMin !== null) {
      if (diffMin < -0.005) {
        line2 = '<div class="cmp-line"><span class="cmp-badge cmp-good">🎉 比历史最低还低 ' + fmtMoney(-diffMin) + '</span></div>';
      } else if (diffMin > 0.005) {
        line2 = '<div class="cmp-line"><span class="cmp-badge cmp-muted">比历史最低高 ' + fmtMoney(diffMin) + '</span></div>';
      } else {
        line2 = '<div class="cmp-line"><span class="cmp-badge cmp-good">= 与历史最低持平</span></div>';
      }
    }

    resultEl.classList.add('show');
    resultEl.innerHTML = '<div class="cmp-line"><span class="cmp-badge ' + cls1 + '">' + line1 + '</span></div>' + line2;
  });

  /* ================= 分类 / 搜索 / 排序 ================= */
  els.chips.addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    activeCat = chip.dataset.cat;
    render();
  });

  els.search.addEventListener('input', render);
  els.sort.addEventListener('change', render);

  $('#btnAddItem').addEventListener('click', () => openItemDialog(null));
  $('#btnSync').addEventListener('click', () => pull());

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && saveTimer) {
      clearTimeout(saveTimer);
      saveTimer = null;
      push();
    }
  });

  /* ================= 启动 ================= */
  loadLocal();
  render();

  if (cfg.gistId) {
    pull();
  } else {
    setStatus('本地模式 · 点 ⚙ 配置同步');
  }
})();
</script>
</body>
</html>
